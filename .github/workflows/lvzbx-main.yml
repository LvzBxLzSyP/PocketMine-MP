name: Build PocketMine-MP

on:
  push:
    branches: [ main, stable, minor-next, major-next ]
  pull_request:
    branches: [ main, stable ]
  workflow_dispatch:

jobs:
  build:
    name: Build PocketMine-MP
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15]
        php: [8.1, 8.2, 8.3]
        include:
          - os: ubuntu-latest
            php: 8.1
            php-binary-url: "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.1-latest/Z-PHP-8.1-Linux-x86_64-PM5-debugging-symbols.tar.gz"
          - os: ubuntu-latest
            php: 8.2
            php-binary-url: "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.2-latest/Z-PHP-8.2-Linux-x86_64-PM5-debugging-symbols.tar.gz"
          - os: ubuntu-latest
            php: 8.3
            php-binary-url: "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.3-latest/Z-PHP-8.3-Linux-x86_64-PM5-debugging-symbols.tar.gz"
          - os: windows-latest
            php: 8.1
            php-binary-url: "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.1-latest/PHP-8.1-Windows-x64-PM5.zip"
          - os: windows-latest
            php: 8.2
            php-binary-url: "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.2-latest/PHP-8.2-Windows-x64-PM5.zip"
          - os: windows-latest
            php: 8.3
            php-binary-url: "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.3-latest/PHP-8.3-Windows-x64-PM5.zip"
          - os: macos-latest
            php: 8.1
            php-binary-url: "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.1-latest/Z-PHP-8.1-MacOS-x86_64-PM5-debugging-symbols.tar.gz"
          - os: macos-latest
            php: 8.2
            php-binary-url: "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.2-latest/Z-PHP-8.2-MacOS-x86_64-PM5-debugging-symbols.tar.gz"
          - os: macos-latest
            php: 8.3
            php-binary-url: "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.3-latest/Z-PHP-8.3-MacOS-x86_64-PM5-debugging-symbols.tar.gz"
          - os: macos-15
            php: 8.1
            php-binary-url: "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.1-latest/Z-PHP-8.1-MacOS-x86_64-PM5-debugging-symbols.tar.gz"
          - os: macos-15
            php: 8.2
            php-binary-url: "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.2-latest/Z-PHP-8.2-MacOS-x86_64-PM5-debugging-symbols.tar.gz"
          - os: macos-15
            php: 8.3
            php-binary-url: "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.3-latest/Z-PHP-8.3-MacOS-x86_64-PM5-debugging-symbols.tar.gz"
            
    steps:
      - name: Record start time
        shell: bash
        run: |
          date +%s > "$HOME/build-start.txt"
          
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup PHP (for Composer)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, mbstring, sqlite3, phar, tokenizer, xml, xmlwriter, simplexml, dom, json, gmp, pcre, sockets, yaml, zip
          ini-values: phar.readonly=Off

      - name: Download PocketMine PHP Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p php-binary
          cd php-binary
          curl -L "${{ matrix.php-binary-url }}" -o php-binary.tar.gz
          tar -xzf php-binary.tar.gz
          find bin-debug/php7/bin -type f -name "*.debug" -exec bash -c 'for f; do mv -- "$f" "${f%.debug}"; done' _ {} +
          find bin-debug/php7/lib -type f -name "*.debug" -exec bash -c 'for f; do mv -- "$f" "${f%.debug}"; done' _ {} +
          chmod +x bin-debug/php7/bin/php
          echo "PHP_LIBRARY_PATH=$(pwd)/bin-debug/php7/lib" >> $GITHUB_ENV
          echo "PHP_BINARY_PATH=$(pwd)/bin-debug/php7/bin/php" >> $GITHUB_ENV

      - name: Download PocketMine PHP Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path php-binary | Out-Null
          Set-Location php-binary
          Invoke-WebRequest -Uri "${{ matrix.php-binary-url }}" -OutFile "php-binary.zip"
          Expand-Archive -Path "php-binary.zip" -DestinationPath .
          "PHP_BINARY_PATH=$((Get-Location).Path)\bin\php\php.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
      - name: Validate PHP Binary(Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        shell: pwsh
        run: |
          & "${{ env.PHP_BINARY_PATH }}" --version
          & "${{ env.PHP_BINARY_PATH }}" -m

      
      - name: Validate PHP Binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $env:LD_LIBRARY_PATH = "${{ env.PHP_LIBRARY_PATH }}:$env:LD_LIBRARY_PATH"
          New-Item -ItemType File -Path $PROFILE -Force
          Add-Content -Path $PROFILE -Value '$env:LD_LIBRARY_PATH = "${{ env.PHP_LIBRARY_PATH }}:$env:LD_LIBRARY_PATH"'
          & "${{ env.PHP_BINARY_PATH }}" --version
          & "${{ env.PHP_BINARY_PATH }}" -m

      - name: Install Composer dependencies
        shell: pwsh
        run: |
          curl -sS https://getcomposer.org/download/latest-stable/composer.phar -o composer.phar
          & "${{ env.PHP_BINARY_PATH }}" composer.phar install --no-dev --classmap-authoritative --prefer-dist

      - name: Build PocketMine-MP Phar
        shell: pwsh
        run: |
          & "${{ env.PHP_BINARY_PATH }}" composer.phar make-server
          
      - name: Record end time and calculate duration
        shell: bash
        run: |
          end=$(date +%s)
          start=$(cat "$HOME/build-start.txt")
          duration=$((end - start))
          echo "$duration" > duration.txt
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketMine-MP-${{ matrix.os }}-php${{ matrix.php }}
          path: |
            ./duration.txt
            ./PocketMine-MP.phar

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: curl, openssl, mbstring, sqlite3, phar, tokenizer, xml, xmlwriter, simplexml, dom, json, gmp, pcre, sockets, yaml, zip

      - name: Download PocketMine PHP Binary
        run: |
          mkdir -p php-binary
          cd php-binary
          curl -L "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.3-latest/Z-PHP-8.3-Linux-x86_64-PM5-debugging-symbols.tar.gz" -o php-binary.tar.gz
          tar -xzf php-binary.tar.gz
          find bin-debug/php7/bin -type f -name "*.debug" -exec bash -c 'for f; do mv -- "$f" "${f%.debug}"; done' _ {} +
          find bin-debug/php7/lib -type f -name "*.debug" -exec bash -c 'for f; do mv -- "$f" "${f%.debug}"; done' _ {} +
          chmod +x bin-debug/php7/bin/php
          echo "PHP_BINARY_PATH=$(pwd)/bin-debug/php7/bin/php" >> $GITHUB_ENV
          echo "PHP_LIBRARY_PATH=$(pwd)/bin-debug/php7/lib" >> $GITHUB_ENV

      - name: Setting variables
        shell: pwsh
        run: |
          $env:LD_LIBRARY_PATH = "${{ env.PHP_LIBRARY_PATH }}:$env:LD_LIBRARY_PATH"
          New-Item -ItemType File -Path $PROFILE -Force
          Add-Content -Path $PROFILE -Value '$env:LD_LIBRARY_PATH = "${{ env.PHP_LIBRARY_PATH }}:$env:LD_LIBRARY_PATH"'

      - name: Install Composer dependencies
        shell: pwsh
        run: |
          curl -sS https://getcomposer.org/download/latest-stable/composer.phar -o composer.phar
          & "${{ env.PHP_BINARY_PATH }}" composer.phar install --prefer-dist

      - name: Run PHPStan
        shell: pwsh
        run: |
          & "${{ env.PHP_BINARY_PATH }}" vendor/bin/phpstan analyze --no-progress --memory-limit=512M
  summary-report:
    name: Summary Report
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate summary table
        shell: bash
        run: |
          echo '| OS | PHP 版本 | 檔案大小 | 耗時 |' > summary.md
          echo '|----|-----------|-----------|--------|' >> summary.md

          for path in artifacts/*; do
            name=$(basename "$path")
            name_stripped=${name#"PocketMine-MP-"}
            os=$(echo "$name_stripped" | sed -E 's/-php[0-9.]+//')
            php=$(echo "$name_stripped" | grep -oE 'php[0-9.]+')
            file="$path/PocketMine-MP.phar"
            if [ ! -f "$file" ]; then continue; fi
            size_bytes=$(stat -c %s "$file")
            size_mb=$(echo "scale=2; $size_bytes / 1048576" | bc)
            duration_file="$path/duration.txt"
            if [[ -f "$duration_file" ]]; then
                duration=$(cat "$duration_file")
            else
                duration="N/A"
            fi
            echo "| $os | $php | ${size_mb} MB (${size_bytes} bytes) | ${duration}s |" >>  summary.md
          done

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary.md
          
